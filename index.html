<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1a0008;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Georgia', serif;
  }

  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    animation: fall linear infinite;
    opacity: 0;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .scene {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    min-height: 100vh;
    width: 100%;
  }

  .envelope-wrapper {
    perspective: 1000px;
  }

  .envelope {
    width: 340px;
    height: 240px;
    background: #8b0000;
    border-radius: 8px;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s;
    box-shadow: 0 8px 32px rgba(200,0,50,0.4);
  }

  .envelope:hover { transform: scale(1.03); }

  .envelope-flap {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 170px solid transparent;
    border-right: 170px solid transparent;
    border-top: 120px solid #6b0000;
    transform-origin: top center;
    transition: transform 0.8s ease;
    z-index: 3;
  }

  .envelope.open .envelope-flap {
    transform: rotateX(180deg);
  }

  .envelope-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 0;
    border-left: 170px solid transparent;
    border-right: 170px solid transparent;
    border-bottom: 120px solid #7a0000;
  }

  .envelope-left {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-top: 120px solid transparent;
    border-bottom: 120px solid transparent;
    border-left: 130px solid #750000;
  }

  .envelope-right {
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-top: 120px solid transparent;
    border-bottom: 120px solid transparent;
    border-right: 130px solid #750000;
  }

  .envelope-seal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 48px; height: 48px;
    background: #c0392b;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    z-index: 4;
    border: 2px solid #ff6b6b;
    transition: opacity 0.3s;
  }

  .envelope.open .envelope-seal { opacity: 0; }

  .hint {
    text-align: center;
    color: #ff9999;
    font-size: 13px;
    margin-top: 12px;
    letter-spacing: 1px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .carta-wrapper {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }

  .carta-wrapper.visible {
    opacity: 1;
    pointer-events: all;
  }

  .carta {
    background: #fff8f8;
    border-radius: 12px;
    padding: 2.5rem 2rem;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    position: relative;
    transform: translateY(60px) scale(0.9);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-top: 6px solid #c0392b;
    text-align: center;
  }

  .carta-wrapper.visible .carta {
    transform: translateY(0) scale(1);
  }

  .carta-deco {
    font-size: 28px;
    margin-bottom: 1rem;
    animation: heartbeat 1.2s infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .carta-titulo {
    font-size: 13px;
    color: #c0392b;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    font-family: 'Georgia', serif;
  }

  .carta-linea {
    width: 60px;
    height: 1px;
    background: #c0392b;
    margin: 0 auto 1.5rem;
    opacity: 0.4;
  }

  .carta-texto {
    font-size: 20px;
    color: #4a1020;
    line-height: 1.8;
    font-family: 'Georgia', serif;
    font-style: italic;
    margin-bottom: 1.5rem;
  }

  .carta-firma {
    font-size: 13px;
    color: #c0392b;
    margin-top: 1rem;
    letter-spacing: 1px;
  }

  .btn-cerrar {
    margin-top: 1.5rem;
    background: none;
    border: 1px solid #c0392b;
    color: #c0392b;
    padding: 8px 24px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 1px;
    transition: all 0.3s;
  }

  .btn-cerrar:hover {
    background: #c0392b;
    color: white;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 19;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }

  .overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  .rosas-bottom {
    text-align: center;
    font-size: 22px;
    margin-top: 0.5rem;
    letter-spacing: 6px;
  }
</style>
</head>
<body>

<canvas class="particles" id="canvas"></canvas>

<div class="scene">
  <div>
    <div class="envelope-wrapper">
      <div class="envelope" id="envelope" onclick="abrirCarta()">
        <div class="envelope-flap"></div>
        <div class="envelope-bottom"></div>
        <div class="envelope-left"></div>
        <div class="envelope-right"></div>
        <div class="envelope-seal">💌</div>
      </div>
    </div>
    <p class="hint">toca para abrir</p>
  </div>
</div>

<div class="overlay" id="overlay" onclick="cerrarCarta()"></div>

<div class="carta-wrapper" id="cartaWrapper">
  <div class="carta">
    <div class="carta-deco">❤️</div>
    <p class="carta-titulo">Para ti</p>
    <div class="carta-linea"></div>
    <p class="carta-texto">
      Lo siento mucho amor,<br>
      Te amo.<br><br>
      ¿Me podrías perdonar?
    </p>
    <div class="carta-linea"></div>
    <div class="rosas-bottom">🌹🌹🌹</div>
    <p class="carta-firma">siempre tuyo, tú Capitan ♡</p>
    <button class="btn-cerrar" onclick="cerrarCarta()">cerrar</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  const symbols = ['❤', '🌹', '·', '♡', '✿'];

  for (let i = 0; i < 35; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 14 + 8,
      speed: Math.random() * 1.2 + 0.4,
      symbol: symbols[Math.floor(Math.random() * symbols.length)],
      opacity: Math.random() * 0.5 + 0.2,
      angle: Math.random() * 360
    });
  }

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.font = p.size + 'px serif';
      ctx.fillText(p.symbol, p.x, p.y);
      ctx.restore();
      p.y += p.speed;
      p.x += Math.sin(p.angle * 0.02) * 0.5;
      p.angle += 0.5;
      if (p.y > canvas.height + 20) {
        p.y = -20;
        p.x = Math.random() * canvas.width;
      }
    });
    requestAnimationFrame(drawParticles);
  }

  drawParticles();

  function abrirCarta() {
    document.getElementById('envelope').classList.add('open');
    setTimeout(() => {
      document.getElementById('overlay').classList.add('visible');
      document.getElementById('cartaWrapper').classList.add('visible');
    }, 600);
  }

  function cerrarCarta() {
    document.getElementById('overlay').classList.remove('visible');
    document.getElementById('cartaWrapper').classList.remove('visible');
    setTimeout(() => {
      document.getElementById('envelope').classList.remove('open');
    }, 400);
  }

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>
</body>
</html>
